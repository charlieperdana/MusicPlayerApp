name: iOS CI/CD

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

jobs:
  test:
    name: Build and Test
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build and run tests
        run: |
          xcodebuild \
            -project MusicPlayerApp.xcodeproj \
            -scheme MusicPlayerApp \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            clean test

  build:
    name: Build iOS App
    needs: test
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build app
        run: |
          xcodebuild \
            -project MusicPlayerApp.xcodeproj \
            -scheme MusicPlayerApp \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build \
            build

      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: MusicPlayerApp
          path: build/Build/Products/Debug-iphonesimulator/MusicPlayerApp.app